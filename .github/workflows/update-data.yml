name: Trigger hourly rebuild

# Cloudflare Pages builds the site from this repository, so a rebuild is just
# a request to Cloudflare rather than a build here. That means this workflow
# needs no checkout, no Python, no dependencies and no third-party actions —
# and therefore has essentially no supply-chain surface of its own.
#
# Cadence rationale (see DECISIONS.md):
#   * SWPC data has a 3h freshness window in our config. Hourly keeps it
#     comfortably fresh and leaves headroom to miss a run or two.
#   * This does NOT mean Celestrak is called hourly. The fetcher refuses to
#     re-request a GP group whose cache is younger than 6h. On Cloudflare that
#     cache is cold every build, so the effective ceiling is one request per
#     group per build — which is why the schedule, not just the code, has to
#     stay conservative.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

# Nothing in this workflow reads or writes repository content.
permissions: {}

# Never cancel an in-flight deploy: a half-published site is worse than a
# slightly delayed one.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  trigger:
    name: Ping Cloudflare Pages deploy hook
    runs-on: ubuntu-latest
    steps:
      - name: Trigger rebuild
        env:
          # Created in the Cloudflare dashboard (Pages project → Settings →
          # Builds & deployments → Deploy hooks) and stored as a GitHub Actions
          # secret. It is a capability URL: anyone holding it can trigger a
          # build, so it is never committed, echoed, or written to logs.
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          set -euo pipefail

          if [ -z "${DEPLOY_HOOK}" ]; then
            echo "CLOUDFLARE_DEPLOY_HOOK is not set."
            echo
            echo "Add it under Settings → Secrets and variables → Actions."
            echo "Until then Cloudflare still rebuilds on every push to main;"
            echo "only the hourly refresh is missing."
            exit 1
          fi

          # --fail turns a non-2xx into a non-zero exit. Output goes to a file
          # rather than stdout so a hook URL echoed back in an error body can
          # never land in the public build log.
          status=$(curl --silent --show-error --fail-with-body \
                        --max-time 30 --retry 3 --retry-delay 10 \
                        --output /tmp/hook-response.json \
                        --write-out '%{http_code}' \
                        -X POST "${DEPLOY_HOOK}") || {
            echo "Deploy hook failed with HTTP ${status:-000}."
            exit 1
          }

          echo "Deploy hook accepted (HTTP ${status}). Cloudflare is rebuilding."
          echo "### Rebuild triggered" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Cloudflare Pages accepted the deploy hook at $(date -u +%FT%TZ)." >> "$GITHUB_STEP_SUMMARY"
          echo "Per-source health is reported on the site itself and in the" >> "$GITHUB_STEP_SUMMARY"
          echo "Cloudflare build log." >> "$GITHUB_STEP_SUMMARY"
