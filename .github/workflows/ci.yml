# Checks for every push and pull request. Nothing here deploys, signs in anywhere or needs a
# secret, and nothing reaches the network once dependencies are installed: the Python tests
# block sockets, the container is run with networking off, and Terraform runs against mocked
# providers.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The same uv the container image is built with (see Dockerfile).
  UV_VERSION: "0.13.9"
  # Named, not "whatever the runner has". The first version of this workflow
  # relied on the runner's Node and broke on it: see the frontend job.
  NODE_VERSION: "22.23.5"

jobs:
  python:
    name: ruff + pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python = ">=3.11", and the container runs 3.12. Testing
        # both means the lower bound is enforced rather than asserted -- if a 3.12-only feature
        # creeps in, CI says so instead of a user finding out.
        python-version: ["3.11", "3.12"]
    # Every uv command in this job targets the matrix interpreter.
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      # Actions are pinned to a commit SHA, not a tag. Tags are movable: a compromised action
      # repository can re-point v7 at other code, and the job would pick it up silently.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      # The suite blocks network access at the fixture level -- urlopen and sockets both -- so
      # this step passing is also evidence that nothing here depends on a live API. It includes
      # the tests that pin what the page, the pipeline and the Terraform must agree on.
      - name: Tests
        run: uv run pytest -v

      # The claim the project rests on, proved through the real entry point rather than through
      # a test's fixtures: with every socket refused and nothing stored, the job still exits 0
      # and publishes a complete document that passes its own validation and says, truthfully,
      # that every source failed. Then the site is assembled around it.
      - name: A run with no network must publish a complete, truthful document
        run: |
          uv run python - <<'PY'
          import json
          import pathlib
          import socket
          import tempfile


          def unreachable(*args, **kwargs):
              raise OSError(101, "Network is unreachable (simulated)")


          socket.socket.connect = unreachable
          socket.create_connection = unreachable
          socket.getaddrinfo = unreachable

          from orbital_watch import job
          from orbital_watch.document import validate
          from orbital_watch.pipeline import SOURCE_LABELS

          with tempfile.TemporaryDirectory() as scratch:
              root = pathlib.Path(scratch)
              code = job.main(["--local-dir", str(root / "local"), "--out", str(root / "dist")])
              assert code == 0, f"the job exited {code} with no network"

              published = root / "local" / "public" / "latest.json"
              document = json.loads(published.read_text())
              problems = validate(document, expected_sources=SOURCE_LABELS)
              assert not problems, problems

              health = document["health"]
              assert health["overall"] == "failed", health["overall"]
              assert health["counts"] == {"fresh": 0, "stale": 0, "failed": 7}, health["counts"]
              assert all(source["error"] for source in health["sources"])
              assert document["sky"]["satellites"] == []
              assert document["space_weather"]["correlation"]["severity"] == "unknown"

              dist = root / "dist"
              assert (dist / "index.html").is_file()
              assert json.loads((dist / "data" / "latest.json").read_text()) == document

          print("OK: exit 0, document valid, 7 of 7 sources reported failed, site assembled")
          PY

  frontend:
    name: page logic (node --test)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node's built-in test runner: the frontend has no package.json and no dependencies, and
      # its tests keep it that way. Only Node itself is installed.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Every script parses
        run: |
          node --version
          for file in web/assets/*.js; do node --check "$file"; done

      # The test files are named (through a glob the shell expands), not their directory. Node 22
      # takes a directory argument to be a single file to run and fails with "Cannot find
      # module"; newer versions search it. Naming the files means the same thing on every version.
      - name: Tests
        run: node --test tests/web/*.test.js

  container:
    name: container image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The image builds
        run: docker build --build-arg REVISION="$GITHUB_SHA" --tag orbital-watch-refresh:ci .

      - name: It does not run as root
        run: test "$(docker run --rm --entrypoint id orbital-watch-refresh:ci -u)" = "10001"

      # The same promise as above, through the image that will actually run: no network at all,
      # and it still exits 0 having published a document.
      - name: It runs with no network and exits 0
        run: docker run --rm --network none orbital-watch-refresh:ci --no-site

  terraform:
    name: terraform (mocked providers)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2

      - name: Format
        run: terraform fmt -check -recursive

      # No backend, so no state and no credentials. Applying is done by hand (infra/README.md),
      # never from a workflow.
      - name: Providers
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

      - name: Tests (mocked providers, nothing created)
        run: terraform test
