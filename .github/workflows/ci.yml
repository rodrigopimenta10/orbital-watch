name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ruff + pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python = ">=3.11". Testing both ends of
        # that range means the claim is enforced rather than asserted -- if a
        # 3.12-only feature creeps in, CI says so instead of a user finding out.
        python-version: ["3.11", "3.12"]
    # Every uv command in this job targets the matrix interpreter.
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      # Pinned to a commit SHA, not a tag. Tags are movable: a compromised
      # action repository can re-point v7 at attacker code, and the job
      # would pick it up silently. Dependabot updates SHA pins fine.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      # The suite blocks network access at the fixture level, so this step
      # passing is also evidence that nothing here depends on a live API.
      - name: Tests
        run: uv run pytest -v

      # The committed snapshot ages into FAILED on the live site correctly,
      # but nothing would prompt anyone to refresh it -- the repo should
      # complain before the site does. 30 days is far past the point where
      # the scheduled refresher has obviously stopped working.
      - name: Seed snapshot must not be rotting
        run: |
          uv run python - <<'PY'
          import json
          import pathlib
          import sys
          from datetime import UTC, datetime, timedelta

          LIMIT = timedelta(days=30)
          manifest = json.loads(pathlib.Path("seed/manifest.json").read_text())
          now = datetime.now(UTC)
          rotten = []
          for name, entry in sorted(manifest["sources"].items()):
              raw = entry.get("retrieved_at")
              stamp = datetime.fromisoformat(raw)
              if stamp.tzinfo is None:
                  stamp = stamp.replace(tzinfo=UTC)
              age = now - stamp
              print(f"  {name}: captured {age.days}d ago")
              if age > LIMIT:
                  rotten.append(f"{name} ({age.days}d)")
          if rotten:
              print(
                  f"\nFAIL: snapshot older than {LIMIT.days} days: {', '.join(rotten)}\n"
                  "The scheduled refresher (refresh-snapshot.yml) has probably "
                  "stopped. Run it manually or investigate why it is not firing."
              )
              sys.exit(1)
          print("Seed snapshot is acceptably fresh.")
          PY

      # Proves the definition-of-done requirement directly, in both of the
      # shapes it can take: with the committed seed available, and without it.
      # These are genuinely different guarantees -- the seed keeps a cold
      # build container serving real data, and its absence must still produce
      # a complete site rather than a crash.
      - name: Build must survive a total upstream blackout
        run: |
          uv run python - <<'PY'
          import json
          import pathlib
          import socket
          import tempfile


          def unreachable(*args, **kwargs):
              raise OSError(101, "Network is unreachable (simulated)")


          socket.socket.connect = unreachable
          socket.create_connection = unreachable
          socket.getaddrinfo = unreachable

          EXPECTED = [
              "meta.json",
              "sky.json",
              "passes.json",
              "space_weather.json",
              "health.json",
          ]


          def build(tag, seed_dir=None):
              """Run the real entry point and return its health block."""
              import importlib

              import orbital_watch.config as config
              import orbital_watch.sources.fetch as fetch

              if seed_dir is not None:
                  config.SEED_DIR = pathlib.Path(seed_dir)
                  fetch.SEED_DIR = pathlib.Path(seed_dir)

              from orbital_watch.build import main

              out = f"dist-offline-{tag}"
              code = main(["--build-dir", out, "--cache-dir", f".cache-{tag}"])
              assert code == 0, f"[{tag}] build exited {code} with no network"

              data = pathlib.Path(out) / "data"
              for name in EXPECTED:
                  payload = json.loads((data / name).read_text())
                  assert payload, f"[{tag}] {name} is empty"

              return json.loads((data / "health.json").read_text())


          # 1. Seed present. Celestrak reads the committed snapshot BY DESIGN
          #    (outcome "snapshot", freshness judged by the snapshot's age, so
          #    not asserted here -- it depends on when the refresher last ran).
          #    SWPC has no cache and a dead network, so it must fall back to
          #    the seed -- and nothing served from a seed may claim freshness,
          #    because a seed means we reached nobody.
          seeded = build("seeded")
          outcomes = {s["name"]: s for s in seeded["sources"]}
          for name, source in outcomes.items():
              if name.startswith("celestrak_"):
                  assert source["outcome"] == "snapshot", (name, source["outcome"])
              else:
                  assert source["outcome"] == "seed", (name, source["outcome"])
                  assert source["state"] != "fresh", (name, source["state"])
          print(
              f"OK seeded: {len(EXPECTED)} files, overall={seeded['overall']}, "
              f"celestrak from snapshot, swpc from seed, no seed claims fresh"
          )

          # 2. No seed at all: the site must still be complete and must report
          #    total failure rather than pretending.
          with tempfile.TemporaryDirectory() as empty:
              bare = build("bare", seed_dir=empty)
          assert bare["overall"] == "failed", bare["overall"]
          assert bare["counts"]["fresh"] == 0, bare["counts"]
          assert bare["counts"]["failed"] == len(bare["sources"])
          print(
              f"OK bare: {len(EXPECTED)} files, "
              f"{bare['counts']['failed']} sources reported failed"
          )
          PY
