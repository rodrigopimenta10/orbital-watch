[project]
name = "orbital-watch"
version = "2.0.0"
description = "Satellite pass tracking correlated with live space-weather conditions: a scheduled job that publishes one document, and a static page that reads it."
readme = "README.md"
authors = [
    { name = "Rodrigo Pimenta", email = "rodrigopimenta102@gmail.com" }
]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["satellite", "sgp4", "space-weather", "orbital-mechanics", "ground-segment"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    # Topocentric geometry and rise/culminate/set search. See DECISIONS.md §2.
    # Upstream HTTP is stdlib urllib -- no requests, no httpx (DECISIONS.md §7).
    "skyfield>=1.49",
    # Declared explicitly because propagate.py imports sgp4.api and sgp4.omm
    # directly. It arrives transitively via skyfield today, but depending on
    # a transitive dependency for a direct import breaks the day skyfield
    # vendors or drops it.
    "sgp4>=2.20",
    # State and the published document live in Cloud Storage. The official
    # client is used for authentication and for conditional (generation-
    # matched) writes; it is imported in store.py and nowhere else. See
    # DECISIONS.md §28 for why this one is not hand-written.
    "google-cloud-storage>=3.0",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyyaml>=6.0.3",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately reach into internals to simulate failure modes.
"tests/*" = ["SLF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    # Our own deprecation warnings are errors -- we want to hear about them.
    "error::DeprecationWarning",
    # ...except this one. skyfield 1.54's find_events() assigns to ndarray.dtype,
    # which NumPy 2.5 deprecates. It is a real latent break (a future NumPy will
    # make it an error and pass prediction will stop working), but it is upstream
    # code we do not control. Tracked in DECISIONS.md; remove this line once
    # skyfield ships a fix, and the tests will tell us if it regresses.
    "ignore:Setting the dtype on a NumPy array has been deprecated:DeprecationWarning",
]
